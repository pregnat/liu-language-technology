[project]
name = "liu-lt"
version = "0.1.0"
description = "Labs for the Language Technology course (729G86/TDP030)"
readme = "README.md"
authors = [
    { name = "Marcel Bollmann", email = "marcel.bollmann@liu.se" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.5.0",
    "docopt>=0.6.2",
    "en-core-web-md",
    "en-core-web-lg",
    "jupyterlab>=4.4.10",
    "nbclassic>=1.3.3",
    "nbdime>=4.0.2",
    "nbgrader>=0.9.5",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "rich>=14.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "spacy>=3.8.11,<3.9",
    "tabulate>=0.9.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
optional = [
    "accelerate>=1.12.0",
    "python-dotenv>=1.2.1",
]
